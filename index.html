<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070A0F" />
<title>Khaled Abdelhadi — The Flow · Pro</title>
<meta name="description" content="An interactive, cinematic CV — ride the coolant through the pipe of a simulation engineer's career." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#070A0F;
    --indigo:#3B2E8C;
    --blue-deep:#152C6E;
    --blue:#1D4ED8;
    --blue-bright:#3B82F6;
    --cyan:#5FE3FF;
    --ink:#EAF2FF;
    --ink-dim:#93A4C4;
    --font-display:"Sora", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); }
  body{ overflow-x:hidden; }
  a{ color:inherit; }

  /* blended-blue gradient mesh sits behind the transparent WebGL canvas */
  .bg-mesh{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(60% 55% at 22% 18%, rgba(59,46,140,.55), transparent 60%),
      radial-gradient(55% 50% at 82% 22%, rgba(29,78,216,.34), transparent 62%),
      radial-gradient(70% 60% at 60% 100%, rgba(23,44,110,.55), transparent 60%),
      radial-gradient(40% 40% at 12% 82%, rgba(95,227,255,.10), transparent 60%),
      var(--bg);
  }
  #gl{ position:fixed; inset:0; width:100vw; height:100vh; z-index:1; display:block; }
  .grade{ position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, transparent 38%, rgba(4,6,12,.55) 80%, rgba(3,4,9,.94) 100%); }

  .overlay{ position:fixed; inset:0; z-index:3; pointer-events:none; }
  .overlay .st-inner,
  .overlay .h-inner,
  .overlay .o-inner{ position:absolute; inset:0; display:flex; flex-direction:column;
    justify-content:center; padding:clamp(1.4rem,6vw,7rem); }

  /* ---------------- header ---------------- */
  header{ position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:space-between;
    padding:1.1rem clamp(1.4rem,5vw,4rem); }
  .mark{ font-family:var(--font-display); font-weight:700; letter-spacing:.16em;
    font-size:.7rem; text-transform:uppercase; color:var(--ink-dim); }
  .tools{ display:flex; align-items:center; gap:1.1rem; pointer-events:auto; }
  .lang{ display:flex; align-items:center; gap:.28rem;
    font-family:var(--font-display); font-size:.72rem; letter-spacing:.12em; }
  .lang button{ background:none; border:0; color:var(--ink); opacity:.34; cursor:pointer;
    font:inherit; padding:.2rem .3rem; letter-spacing:inherit; transition:opacity .25s; }
  .lang button.on{ opacity:1; }
  .lang span{ opacity:.22; }
  #sound{ background:none; border:0; color:var(--ink-dim); cursor:pointer;
    font-family:var(--font-display); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  #sound.on{ color:var(--cyan); opacity:1; }

  .rail{ position:fixed; right:clamp(.9rem,3vw,2.2rem); top:50%; transform:translateY(-50%);
    z-index:6; width:2px; height:36vh; background:rgba(147,180,255,.12); }
  .rail i{ position:absolute; left:0; right:0; top:0; height:0%;
    background:linear-gradient(var(--cyan), var(--blue-bright)); }

  /* ---------------- hero ---------------- */
  #hero{ z-index:4; }
  #hero .portrait{
    position:absolute; right:clamp(1.4rem,7vw,9rem); top:50%; transform:translateY(-50%);
    width:clamp(190px,24vw,340px); aspect-ratio:1/1; border-radius:3px; overflow:hidden;
    -webkit-mask-image:radial-gradient(130% 130% at 50% 35%, #000 55%, transparent);
            mask-image:radial-gradient(130% 130% at 50% 35%, #000 55%, transparent);
  }
  #hero .portrait img{ width:100%; height:100%; object-fit:cover; display:block;
    filter:contrast(1.03) saturate(1.02); }
  #hero .portrait::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(155deg, transparent 55%, rgba(7,10,15,.55));
    mix-blend-mode:normal; }
  #hero .h-eyebrow{ font-family:var(--font-display); letter-spacing:.34em; text-transform:uppercase;
    font-size:.66rem; color:var(--cyan); margin-bottom:1.4rem; }
  #hero h1{ font-family:var(--font-display); font-weight:300; line-height:.9;
    font-size:clamp(2.7rem,8.6vw,6.8rem); letter-spacing:-.02em; }
  #hero h1 b{ display:block; font-weight:700;
    background:linear-gradient(96deg, var(--blue-bright), var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #hero .h-tag{ margin-top:1.1rem; font-family:var(--font-display); font-weight:400;
    color:var(--ink); font-size:clamp(.95rem,1.5vw,1.2rem); letter-spacing:.01em; }
  #hero .h-sub{ margin-top:1rem; max-width:34ch; color:var(--ink-dim);
    font-size:clamp(.9rem,1.25vw,1.05rem); line-height:1.65; }

  .scroll-cue{ position:absolute; left:50%; bottom:1.9rem; transform:translateX(-50%);
    font-family:var(--font-display); font-size:.62rem; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:.5rem; }
  .scroll-cue i{ width:1px; height:32px; background:linear-gradient(var(--cyan), transparent);
    animation:cue 1.9s ease-in-out infinite; }
  @keyframes cue{ 0%,100%{opacity:.12; transform:scaleY(.3);} 50%{opacity:1; transform:scaleY(1);} }

  /* ---------------- stations ---------------- */
  .station{ z-index:3; opacity:0; visibility:hidden; }
  .st-card{ max-width:48ch; }
  .st-kick{ font-family:var(--font-display); font-size:.64rem; letter-spacing:.28em;
    text-transform:uppercase; color:var(--cyan); margin-bottom:1rem; }
  .st-years{ font-family:var(--font-display); font-weight:700; font-size:clamp(3rem,9vw,7.2rem);
    line-height:.84; letter-spacing:-.03em;
    background:linear-gradient(94deg, var(--blue-bright), var(--cyan) 70%, #fff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .st-dur{ font-family:var(--font-display); font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--blue-tint, #93B4FF); margin-top:.45rem; }
  .st-org{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.2rem,2.7vw,2.1rem); margin-top:.7rem; }
  .st-role{ font-family:var(--font-display); font-weight:400; color:var(--ink); margin-top:.35rem;
    font-size:clamp(.95rem,1.5vw,1.15rem); }
  .st-place{ color:var(--ink-dim); letter-spacing:.05em; margin-top:.3rem; font-size:.88rem; }
  .st-bullets{ margin-top:1.4rem; list-style:none; display:flex; flex-direction:column; gap:.6rem; }
  .st-bullets li{ color:var(--ink-dim); padding-left:1rem; position:relative; line-height:1.5;
    max-width:44ch; font-size:.94rem; }
  .st-bullets li::before{ content:""; position:absolute; left:0; top:.6em; width:5px; height:5px;
    background:var(--blue-bright); }
  .station.kind-upcoming .st-kick{ color:var(--cyan);
    display:inline-flex; align-items:center; gap:.5rem; }
  .station.kind-upcoming .st-kick::before{ content:""; width:7px; height:7px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 12px var(--cyan); animation:beacon 1.6s ease-in-out infinite; }
  @keyframes beacon{ 0%,100%{opacity:.35; transform:scale(.7);} 50%{opacity:1; transform:scale(1);} }
  .station.kind-upcoming .st-years{ -webkit-text-fill-color:var(--cyan); }
  /* education / training milestones read lighter — waypoints, not chapters */
  .station.kind-edu .st-years, .station.kind-training .st-years{
    font-size:clamp(2.2rem,6vw,4.6rem); font-weight:600; }
  .station.kind-edu .st-kick, .station.kind-training .st-kick{ color:var(--blue-tint, #93B4FF); }
  .station.kind-venture .st-kick{ color:var(--blue-bright); }

  /* degree gates — red when a chapter opens, green when it's passed */
  .station.gate-start .st-years{
    background:linear-gradient(94deg,#FF5A5A,#FFB199); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .station.gate-done .st-years{
    background:linear-gradient(94deg,#2EBF7B,#8CF5C6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .station.gate-start .st-kick, .station.gate-done .st-kick{
    display:inline-flex; align-items:center; gap:.55rem;
    font-size:.62rem; letter-spacing:.3em; }
  .station.gate-start .st-kick{ color:#FF8A8A; }
  .station.gate-done .st-kick{ color:#5EE6A8; }
  .station.gate-start .st-kick::before, .station.gate-done .st-kick::before{
    content:""; width:22px; height:1px; }
  .station.gate-start .st-kick::before{ background:linear-gradient(90deg,transparent,#FF5A5A); }
  .station.gate-done .st-kick::before{ background:linear-gradient(90deg,transparent,#3ECF8E); }
  /* the training gate — a single purple valve in the line */
  .station.gate-train .st-years{
    background:linear-gradient(94deg,#9E6BFF,#D9C4FF); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .station.gate-train .st-kick{ color:#BE9CFF;
    display:inline-flex; align-items:center; gap:.55rem;
    font-size:.62rem; letter-spacing:.3em; }
  .station.gate-train .st-kick::before{ content:""; width:22px; height:1px;
    background:linear-gradient(90deg,transparent,#9E6BFF); }

  /* the job illustration panel — an engineering sketch that draws itself */
  .st-viz-wrap{
    position:absolute; right:clamp(1.2rem,6vw,7rem); top:50%; transform:translateY(-50%);
    width:clamp(280px,34vw,500px); pointer-events:none; }
  /* soft dark halo behind each projection so it reads on ANY background,
     including the bright tunnel core on phones */
  .st-viz-wrap::before{ content:""; position:absolute; inset:-14%; z-index:-1;
    background:radial-gradient(52% 52% at 50% 50%, rgba(4,7,13,.78), transparent 74%); }
  .st-viz{ width:100%; height:auto; display:block;
    filter:drop-shadow(0 0 26px rgba(59,130,246,.20)); }

  /* generated still shown as a PROJECTION: the image files carry real
     transparency (black baked to alpha), so only the lit subject + its glow
     float in the pipe. A soft radial mask kills any residual edge.
     Hologram life: a light sweep + a faint flicker make it feel projected. */
  .st-photo{ position:relative;
    -webkit-mask-image:radial-gradient(120% 120% at 50% 50%, #000 58%, transparent 92%);
            mask-image:radial-gradient(120% 120% at 50% 50%, #000 58%, transparent 92%); }
  .st-photo img{ width:100%; height:auto; display:block; transform-origin:60% 45%;
    filter:drop-shadow(0 0 34px rgba(59,130,246,.22));
    animation:kenburns 22s ease-in-out infinite alternate,
              holoflicker 8.5s linear infinite; }
  .st-photo::after{ content:""; position:absolute; inset:-10%;
    background:linear-gradient(112deg, transparent 43%,
      rgba(170,225,255,.16) 50%, rgba(170,225,255,.05) 53%, transparent 60%);
    animation:sheen 6.5s ease-in-out infinite; pointer-events:none; }
  @keyframes kenburns{ from{ transform:scale(1.02) translate(0,0); }
                       to{ transform:scale(1.12) translate(-2.5%,1.5%); } }
  @keyframes sheen{ 0%{ transform:translateX(-130%);} 55%{ transform:translateX(130%);}
                    100%{ transform:translateX(130%);} }
  @keyframes holoflicker{ 0%,89%,100%{ opacity:1; } 90%{ opacity:.96; }
                          91.5%{ opacity:1; } 93%{ opacity:.94; } 94%{ opacity:1; } }
  @media (prefers-reduced-motion:reduce){
    .st-photo img{ animation:none; } .st-photo::after{ animation:none; display:none; } }

  /* video projections — screen blending melts their black into the pipe */
  .st-video{ position:fixed; right:clamp(1.2rem,6vw,7rem); top:50%;
    width:clamp(280px,34vw,500px); height:auto; z-index:3;
    mix-blend-mode:screen; opacity:0; visibility:hidden; pointer-events:none;
    /* crush the residual room/floor: darks -> true black, subject untouched */
    filter:contrast(1.32) brightness(1.04) saturate(1.08);
    -webkit-mask-image:radial-gradient(115% 115% at 50% 48%, #000 46%, transparent 82%);
            mask-image:radial-gradient(115% 115% at 50% 48%, #000 46%, transparent 82%); }
  /* when a station has a live video, its still image steps aside */
  .station.has-video .st-viz-wrap{ display:none; }

  /* the route — positions list beside the portrait */
  #route{ position:absolute; right:clamp(1.4rem,7vw,9rem); top:calc(50% + clamp(110px,14vw,190px));
    width:clamp(200px,24vw,340px); }
  #route .r-title{ font-family:var(--font-display); font-size:.6rem; letter-spacing:.3em;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:.6rem; }
  #route ol{ list-style:none; display:flex; flex-direction:column; gap:.28rem; }
  #route li{ display:flex; gap:.7rem; font-size:.72rem; color:var(--ink-dim); line-height:1.35; }
  #route li b{ font-family:var(--font-display); font-weight:600; color:var(--blue-bright);
    min-width:4.4em; font-size:.66rem; letter-spacing:.04em; padding-top:.08em; }
  #route li.up span, #route li.up b{ color:var(--cyan); }

  /* ---------------- outro ---------------- */
  #outro{ z-index:4; opacity:0; visibility:hidden; }
  #outro .o-kick{ font-family:var(--font-display); font-size:.64rem; letter-spacing:.3em;
    text-transform:uppercase; color:var(--cyan); margin-bottom:1.1rem; }
  #outro .o-line{ font-family:var(--font-display); font-weight:300; line-height:1.15;
    font-size:clamp(1.5rem,3.6vw,2.9rem); max-width:20ch; }
  #outro .o-loc{ margin-top:1.4rem; color:var(--ink-dim); font-size:.92rem; letter-spacing:.03em; }
  #outro .o-links{ margin-top:1.8rem; display:flex; flex-wrap:wrap; gap:1.4rem; align-items:center; pointer-events:auto; }
  #outro .o-links a, #outro .o-links button{
    font-family:var(--font-display); font-size:.8rem; letter-spacing:.06em;
    color:var(--ink); text-decoration:none; border:0; background:none; cursor:pointer;
    border-bottom:1px solid rgba(147,180,255,.3); padding-bottom:.2rem; }
  #outro .o-links a.cta{ border:1px solid var(--cyan); color:var(--cyan); padding:.6rem 1.1rem; border-radius:2px; }
  #replay{ color:var(--ink-dim) !important; border-bottom-color:transparent !important; }

  /* ---------------- preloader ---------------- */
  #preloader{ position:fixed; inset:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1.3rem;
    transition:opacity .9s ease, visibility .9s; }
  #preloader.done{ opacity:0; visibility:hidden; }
  #preloader .pl-label{ font-family:var(--font-display); letter-spacing:.42em; text-transform:uppercase;
    font-size:.64rem; color:var(--ink-dim); }
  #preloader .pl-bar{ width:min(220px,48vw); height:1px; background:#18203a; position:relative; overflow:hidden; }
  #preloader .pl-bar i{ position:absolute; inset:0 auto 0 0; width:0%;
    background:linear-gradient(90deg, var(--blue-bright), var(--cyan)); }

  .fine{ position:fixed; left:clamp(1.4rem,5vw,4rem); bottom:1.15rem; z-index:6;
    font-family:var(--font-display); font-size:.58rem; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink-dim); opacity:.4; }

  @media (max-width:720px){
    #hero .portrait{ position:static; transform:none; margin-bottom:1.2rem; width:min(46vw,180px); }
    #route{ position:static; width:auto; margin:.9rem 0 0; }
    #route ol{ gap:.16rem; }
    #route li{ font-size:.66rem; }
    .overlay .h-inner{ justify-content:flex-end; padding-bottom:3.5rem;
      background:linear-gradient(180deg, transparent 26%, rgba(5,8,14,.86) 60%); }

    /* stations: projection floats top-centre over the pipe mouth,
       text reads on a dark scrim anchored to the bottom */
    .overlay .st-inner{ justify-content:flex-end; padding-bottom:3.2rem;
      background:linear-gradient(180deg, transparent 30%, rgba(5,8,14,.88) 62%); }
    .st-viz-wrap{ left:50%; right:auto; top:6%; width:min(76vw,340px); }
    .st-card{ max-width:none; }
    .st-years{ font-size:2.6rem; }
    .st-org{ font-size:1.25rem; }
    .st-role{ font-size:.95rem; }
    .st-bullets li{ font-size:.88rem; max-width:none; }
    .st-bullets{ margin-top:1rem; gap:.45rem; }

    /* outro joins the bottom-anchored pattern */
    .overlay .o-inner{ justify-content:flex-end; padding-bottom:4rem;
      background:linear-gradient(180deg, transparent 30%, rgba(5,8,14,.88) 62%); }
    #outro .o-line{ max-width:none; font-size:1.35rem; }

    .rail{ display:none; }
  }
  @media (max-height:600px) and (min-width:721px){
    #route{ display:none; }  /* very short windows: keep the hero clean */
  }
  @media (max-width:720px) and (max-height:719px){
    #route{ display:none; }  /* short phones: name + portrait take priority */
  }
  @media (prefers-reduced-motion:reduce){ .scroll-cue i{ animation:none; } }

  /* ================= PRO layer ================= */
  body.post .bg-mesh, body.post .grade{ display:none; }   /* drawn in the shader instead */
  #hud{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:.9rem; font-family:var(--font-display);
    font-size:.64rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim);
    opacity:0; transition:opacity .6s; white-space:nowrap; }
  body.in-pipe #hud{ opacity:1; }
  #hud .hud-idx{ color:var(--ink); font-variant-numeric:tabular-nums; }
  #hud .hud-flow{ width:54px; height:1px; background:rgba(147,180,255,.16); position:relative; overflow:hidden; }
  #hud .hud-flow i{ position:absolute; inset:0; transform-origin:left; transform:scaleX(.08);
    background:linear-gradient(90deg,var(--blue-bright),var(--cyan)); }
  #hud .hud-org{ max-width:36ch; overflow:hidden; text-overflow:ellipsis; }
  #hud .hud-org.swap{ animation:hudswap .55s cubic-bezier(.2,.7,.2,1); }
  @keyframes hudswap{ from{ opacity:0; transform:translateY(6px); filter:blur(4px);} to{ opacity:1; transform:none; filter:none;} }

  /* timeline: one dot per station, click to travel */
  #tl{ position:fixed; right:clamp(.9rem,3vw,2.2rem); top:50%; transform:translateY(-50%);
    z-index:7; height:52vh; width:14px; pointer-events:auto; opacity:0; transition:opacity .6s; }
  body.in-pipe #tl{ opacity:1; }
  #tl .tl-track{ position:absolute; left:6px; top:0; bottom:0; width:2px; background:rgba(147,180,255,.12); }
  #tl .tl-fill{ position:absolute; left:0; right:0; top:0; height:var(--p,0%);
    background:linear-gradient(var(--cyan), var(--blue-bright)); box-shadow:0 0 10px rgba(95,227,255,.5); }
  #tl .tl-list{ position:absolute; inset:0; }
  #tl .tl-dot{ position:absolute; left:0; top:var(--p); transform:translateY(-50%); width:14px; height:14px;
    background:none; border:0; padding:0; cursor:pointer; display:grid; place-items:center; }
  #tl .tl-dot i{ width:6px; height:6px; border-radius:50%; background:var(--c); opacity:.45;
    transition:transform .35s cubic-bezier(.2,.7,.2,1), opacity .35s, box-shadow .35s; }
  #tl .tl-dot.kind-edu i{ width:5px; height:5px; border-radius:1px; transform:rotate(45deg); }
  #tl .tl-dot:hover i, #tl .tl-dot.on i{ opacity:1; transform:scale(1.7); box-shadow:0 0 14px var(--c); }
  #tl .tl-dot.kind-edu:hover i, #tl .tl-dot.kind-edu.on i{ transform:rotate(45deg) scale(1.6); }
  #tl .tl-lab{ position:absolute; right:22px; top:50%; transform:translate(8px,-50%); opacity:0;
    pointer-events:none; white-space:nowrap; text-align:right; display:flex; flex-direction:column; gap:.1rem;
    transition:opacity .25s, transform .25s; }
  #tl .tl-dot:hover .tl-lab, #tl .tl-dot.on .tl-lab{ opacity:1; transform:translate(0,-50%); }
  #tl .tl-lab b{ font-family:var(--font-display); font-weight:600; font-size:.62rem; letter-spacing:.08em; color:var(--c); }
  #tl .tl-lab em{ font-style:normal; font-family:var(--font-display); font-size:.6rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); }
  #tl .tl-dot.on .tl-lab em{ color:var(--ink); }

  /* prev / next */
  #navbtns{ position:fixed; right:clamp(.9rem,3vw,2.2rem); bottom:1.3rem; z-index:7; display:flex; gap:.4rem;
    opacity:0; transition:opacity .6s; }
  body.in-pipe #navbtns{ opacity:1; }
  #navbtns button{ width:38px; height:38px; border-radius:50%; border:1px solid rgba(147,180,255,.22);
    background:rgba(7,10,15,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--ink); cursor:pointer; display:grid; place-items:center; transition:border-color .3s, background .3s, transform .3s; }
  #navbtns button:hover{ border-color:var(--cyan); background:rgba(29,78,216,.28); transform:translateY(-1px); }
  #navbtns svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  #flash{ position:fixed; inset:0; z-index:2; pointer-events:none; opacity:0; }
  #cursor{ position:fixed; left:0; top:0; z-index:8; pointer-events:none; width:280px; height:280px; margin:-140px 0 0 -140px;
    border-radius:50%; mix-blend-mode:screen; will-change:transform;
    background:radial-gradient(circle, rgba(95,227,255,.16), rgba(59,130,246,.06) 42%, transparent 70%); }
  @media (hover:none), (pointer:coarse){ #cursor{ display:none; } }

  /* hero: letters rise once the preloader clears; portrait tilts with the pointer */
  #hero h1 i{ font-style:normal; display:inline-block; opacity:0; transform:translateY(.55em) rotate(4deg); }
  body.ready #hero h1 i{ animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(.12s + var(--k) * 45ms); }
  #hero h1 b i{ background:inherit; -webkit-background-clip:text; background-clip:text; color:transparent; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  #hero .portrait{ transition:transform .12s linear; will-change:transform; }
  .scroll-cue small{ font-size:.52rem; letter-spacing:.18em; opacity:.45; text-transform:none; }
  #preloader .pl-pct{ font-family:var(--font-display); font-size:.62rem; letter-spacing:.3em; color:var(--blue-bright); font-variant-numeric:tabular-nums; }

  /* glass card + per-line choreography + tool chips */
  .st-card{ position:relative; padding:clamp(1.1rem,2.2vw,1.8rem) clamp(1.2rem,2.4vw,2rem);
    border-radius:16px; background:linear-gradient(160deg, rgba(10,16,28,.62), rgba(7,10,15,.34));
    border:1px solid rgba(147,180,255,.12); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04); }
  .st-card::before{ content:""; position:absolute; left:0; right:0; top:0; height:1px; border-radius:16px 16px 0 0;
    background:linear-gradient(90deg, transparent, var(--c, var(--cyan)) 30%, var(--c, var(--cyan)) 60%, transparent); opacity:.8; }
  .st-card::after{ content:""; position:absolute; left:-1px; top:18%; bottom:18%; width:2px; border-radius:2px;
    background:var(--c, var(--cyan)); box-shadow:0 0 16px var(--c, var(--cyan)); opacity:.7; }
  .st-card > *{ will-change:transform, opacity; }
  .st-years{ white-space:nowrap; font-size:clamp(2.6rem,7vw,6.2rem); }
  .station.kind-edu .st-years{ font-size:clamp(2rem,5.2vw,4.2rem); }
  .st-tools{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:1rem; }
  .st-tools span{ font-family:var(--font-display); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink); padding:.34rem .6rem; border-radius:999px; border:1px solid rgba(147,180,255,.18);
    background:rgba(29,78,216,.14); }
  .station.gate-start .st-tools span{ border-color:rgba(255,107,107,.3); background:rgba(255,90,90,.1); }
  .station.gate-done .st-tools span{ border-color:rgba(62,207,142,.3); background:rgba(62,207,142,.1); }
  .st-viz-wrap{ will-change:transform, opacity; }

  #outro .o-stats{ margin-top:1.6rem; display:flex; gap:2.2rem; flex-wrap:wrap; }
  #outro .o-stats b{ display:block; font-family:var(--font-display); font-weight:600; font-size:1.5rem; letter-spacing:-.01em;
    background:linear-gradient(94deg, var(--blue-bright), var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #outro .o-stats span{ font-family:var(--font-display); font-size:.6rem; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-dim); }
  #copy.ok{ color:var(--cyan) !important; }

  @media (max-width:720px){
    #hud .hud-org, #hud .hud-flow{ display:none; }
    #hud{ position:static; transform:none; }
    #tl{ right:auto; left:50%; top:auto; bottom:.9rem; transform:translateX(-50%); height:14px; width:min(62vw,300px); }
    #tl .tl-track{ left:0; right:0; top:6px; bottom:auto; width:auto; height:2px; }
    #tl .tl-fill{ top:0; bottom:0; height:auto; width:var(--p,0%); background:linear-gradient(90deg,var(--blue-bright),var(--cyan)); }
    #tl .tl-dot{ top:0; left:var(--p); transform:translateX(-50%); }
    #tl .tl-lab{ display:none; }
    #navbtns{ right:.9rem; bottom:.7rem; }
    #navbtns button{ width:34px; height:34px; }
    .st-card{ padding:1rem 1.1rem; border-radius:12px; }
    .scroll-cue small{ display:none; }
    .rail{ display:none; }
    /* header stays on one line with HUD + sound + language */
    header{ padding:.9rem 1rem; gap:.6rem; }
    .mark{ white-space:nowrap; font-size:.6rem; letter-spacing:.12em; }
    #sound{ white-space:nowrap; font-size:.58rem; }
    .tools{ gap:.7rem; }
    #hud{ font-size:.6rem; }
    /* hero: room above the eyebrow, and the scroll cue sits below the copy */
    #hero .h-eyebrow{ margin-top:1.1rem; margin-bottom:.8rem; }
    .overlay .h-inner{ padding-bottom:6.2rem; }
    #route ol{ gap:.08rem; }
    /* bottom strip belongs to the timeline on phones */
    body.in-pipe .fine{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ #hero h1 i{ opacity:1; transform:none; animation:none !important; } #hud .hud-org.swap{ animation:none; } }
</style>
</head>
